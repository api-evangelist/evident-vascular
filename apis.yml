aid: evident-vascular
name: Evident Vascular
description: 'Evident Vascular, Inc. is a San Jose, California medical device company
  developing the Evident Vascular Guidance System, an AI-powered intravascular ultrasound
  (IVUS) platform purpose-built for peripheral vascular image-guided therapy, with
  future capability intended for coronary procedures. The company came out of stealth
  in 2023 with a $35M Series A led by Vensana Capital and closed a Series B in March
  2025 with Shangbay Capital and strategic investors, funding work toward FDA 510(k)
  clearance and a U.S. launch. The platform pairs an IVUS catheter and console with
  machine-learning image interpretation intended to improve vessel assessment and
  streamline the interventional workflow. Evident Vascular is pre-commercial and
  publishes no developer program, API, SDK, or machine-readable interface on its
  public web surface.'
